<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Друзья — CyberAudio Hub</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% include '_design_head.html' %}
</head>

<body>

    <div class="background-effects"></div>

    {% include '_user_menu.html' %}

    <main class="admin-page friends-page" id="main-content">
        <a href="/" class="back-button">&lt; НАЗАД К МЕДИАТЕКЕ</a>

        <header class="admin-header">
            <span class="eyebrow">НА ОДНОЙ ВОЛНЕ</span>
            <h1>Друзья</h1>
            <p class="page-description">Находите своих людей и сравнивайте достижения.</p>
        </header>

        <section class="admin-section">
            <div class="admin-section__head">
                <h2>Найти человека</h2>
            </div>
            <div class="library-search friends-search">
                <i class="fas fa-magnifying-glass"></i>
                <input type="text" id="friend-search" maxlength="64" autocomplete="off"
                    placeholder="Логин или никнейм, минимум два знака">
            </div>
            <div class="friend-list" id="search-results"></div>
        </section>

        <section class="admin-section" id="incoming-section" hidden>
            <div class="admin-section__head">
                <h2>Заявки к вам</h2>
            </div>
            <div class="friend-list" id="incoming-list"></div>
        </section>

        <section class="admin-section" id="outgoing-section" hidden>
            <div class="admin-section__head">
                <h2>Вы отправили</h2>
            </div>
            <div class="friend-list" id="outgoing-list"></div>
        </section>

        <section class="admin-section">
            <div class="admin-section__head">
                <h2>Мои друзья</h2>
            </div>
            <div class="friend-list" id="friends-list"></div>
        </section>

        <section class="admin-section" id="compare-section" hidden>
            <div class="admin-section__head">
                <h2 id="compare-title">Сравнение достижений</h2>
                <button type="button" class="panel-btn" id="compare-close">
                    <i class="fas fa-xmark"></i> Закрыть
                </button>
            </div>
            <div class="compare-summary" id="compare-summary"></div>
            <div id="compare-body"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/themes.js', v='20260909-2') }}"></script>
    <script src="{{ url_for('static', filename='js/friends.js') }}"></script>
</body>

</html>
