<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing...</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% include '_design_head.html' %}
</head>

<body>
    <div class="background-effects"></div>

    {% include '_user_menu.html' %}

    <main class="player-page" id="main-content">
        <a href="/" class="back-button" id="back-button">&lt; НАЗАД К МЕДИАТЕКЕ</a>

        <div class="text-view" id="text-view" hidden>
            <div class="mini-player" id="mini-player"></div>
            <div class="transcript-toolbar">
                <span class="transcript-chapter" id="transcript-chapter"></span>
                <label class="transcript-follow">
                    <input type="checkbox" id="whole-book-toggle" autocomplete="off">
                    <span>Вся книга</span>
                </label>
                <label class="transcript-follow">
                    <input type="checkbox" id="follow-toggle" checked autocomplete="off">
                    <span>Следить за текстом</span>
                </label>
                <!-- Тайминги слов у распознавания приблизительные и обычно чуть
                     опережают речь. Здесь читатель подгоняет подсветку под себя. -->
                <div class="transcript-sync" id="transcript-sync">
                    <button type="button" class="sync-btn" id="sync-minus"
                        title="Подсветка раньше">−</button>
                    <button type="button" class="sync-value" id="sync-value"
                        title="Сбросить сдвиг">0,00 с</button>
                    <button type="button" class="sync-btn" id="sync-plus"
                        title="Подсветка позже">+</button>
                </div>
            </div>
            <div class="transcript" id="transcript"></div>
        </div>

        <button type="button" class="reader-scroll-top" id="reader-scroll-top" hidden
            aria-label="Поднять текст к началу" title="К началу текста">
            <i class="fas fa-arrow-up" aria-hidden="true"></i>
            <span>К началу</span>
        </button>

        <div class="player-container" id="player-container">
            <div class="loading-state">
                <h2>ЗАГРУЗКА ДАННЫХ...</h2>
                <div class="loader"></div>
            </div>
        </div>

        <audio id="audio-player" preload="metadata"></audio>
    </main>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/themes.js', v='20260909-2') }}"></script>
    <script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>

</html>
