<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения — CyberAudio Hub</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% include '_design_head.html' %}
</head>

<body>

    <div class="background-effects"></div>

    {% include '_user_menu.html' %}

    <main class="admin-page achievements-page" id="main-content">
        <a href="/" class="back-button">&lt; НАЗАД К МЕДИАТЕКЕ</a>

        <header class="admin-header">
            <span class="eyebrow">ВАША КОЛЛЕКЦИЯ ВПЕЧАТЛЕНИЙ</span>
            <h1>Достижения</h1>
            <p class="page-description">Каждая история оставляет свой след.</p>
        </header>

        <p class="achievements-summary" id="achievements-summary"></p>

        <div class="achievements-controls">
            <label>
                Порядок
                <select id="achievements-sort">
                    <option value="groups">По книгам</option>
                    <option value="rarity">Сначала легендарные</option>
                    <option value="rarity-asc">Сначала обычные</option>
                    <option value="name">По названию</option>
                    <option value="earned">Сначала полученные</option>
                </select>
            </label>
            <label>
                <input type="checkbox" id="achievements-hide" checked autocomplete="off">
                Скрыть неполученные
            </label>
        </div>

        <div class="achievement-grid" id="achievement-grid">
            <div class="loading-state">
                <div class="loader"></div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/themes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/achievements.js') }}"></script>
</body>

</html>
