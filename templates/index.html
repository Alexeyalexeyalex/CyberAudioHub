<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberAudio Hub</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="background-effects"></div>

    {% include '_user_menu.html' %}

    <header class="main-header">
        <h1><a class="home-link" href="/" title="На главную">CYBER_AUDIO_HUB</a></h1>
    </header>

    <main>
        <p class="subtitle">👾Ваша коллекция из будущего</p>

        <div class="library-controls">
            <div class="library-search">
                <i class="fas fa-magnifying-glass"></i>
                <input type="text" id="library-search" placeholder="Поиск по медиатеке"
                    autocomplete="off" maxlength="64">
                <button type="button" class="search-clear" id="search-clear"
                    title="Очистить" hidden><i class="fas fa-xmark"></i></button>
            </div>
            <label class="library-sort">
                <span>Порядок</span>
                <select id="library-sort">
                    <option value="name">По названию</option>
                    <option value="name-desc">По названию, наоборот</option>
                    <option value="recent">Сначала недавние</option>
                    <option value="remaining">Меньше осталось</option>
                </select>
            </label>
        </div>

        <!-- Личные подборки: их видит только владелец -->
        <section class="my-folders" id="my-folders" hidden>
            <div class="my-folders__head">
                <h2>Мои папки</h2>
                <div class="my-folders__actions">
                    <button type="button" class="panel-btn" id="folder-add">
                        <i class="fas fa-folder-plus"></i> Создать
                    </button>
                    <button type="button" class="panel-btn" id="folder-show">
                        <i class="fas fa-folder-tree"></i> Мои папки
                    </button>
                </div>
            </div>
        </section>

        <nav class="breadcrumbs" id="breadcrumbs-container"></nav>

        <section class="album-selection">
            <div class="album-grid" id="album-grid">
                <div class="loading-state">
                    <h2>СКАНИРОВАНИЕ МЕДИАТЕКИ...</h2>
                    <div class="loader"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>© 2077 CyberAudio Corp.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/themes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
